    depends_on: [EP-06.03, EP-09.03]
    priority: P0
    risk: Critical
    security_critical: true
    release_gate: Pilot
    milestone: pilote-ferme
    size: M
    acceptance_criteria:
      - Aucun remplissage n'a lieu sans vérification serveur du mandat au moment de l'usage (pas de cache de décision non revalidée).

  - id: EP-09.06
    program: P09
    title: Déchiffrer localement et remplir sans affichage volontaire
    description: Cœur fonctionnel de l'extension (design V1 §6, ADR 0005) — remplissage local sous mandat, aucun affichage/export/copie par défaut.
    depends_on: [EP-05.06, EP-09.04, EP-09.05]
    priority: P0
    risk: Critical
    security_critical: true
    release_gate: Pilot
    milestone: pilote-ferme
    size: L
    acceptance_criteria:
      - Le secret déchiffré n'est jamais accessible via l'inspecteur DOM/console du navigateur.
      - Aucune fonction d'export, de copie ou d'affichage du secret n'existe dans le build V1.

  - id: EP-09.07
    program: P09
    title: Émettre les événements de preuve d'usage
