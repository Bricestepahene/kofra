    risk: Critical
    security_critical: true
    release_gate: Pilot
    milestone: pilote-ferme
    size: L
    acceptance_criteria:
      - Tests exécutés sur au moins deux navigateurs cibles (ex. Chrome, Firefox/Edge).
      - Un scénario de page hôte malveillante tentant d'intercepter le remplissage est couvert par un test qui échoue si l'interception réussit.

