# KOFRA — Backlog canonique de livraison
#
# Source de vérité versionnée pour le GitHub Project "KOFRA — Delivery System".
# scripts/sync-github-project.ts lit ce fichier et crée/synchronise le projet,
# ses champs personnalisés et une issue par epic — de façon idempotente.
#
# Ne pas créer manuellement d'epics dans GitHub : modifier ce fichier, puis
# relancer le script de synchronisation.
#
# Champs dérivés par rubrique (voir docs/execution/README.md §"Rubrique
# d'estimation") plutôt que fixés un par un : risk, security_critical,
# release_gate, priority, size sont un premier jet cohérent et éditable,
# pas une vérité figée. Le champ "Estimate" (jours réels) du Project reste
# volontairement vide au niveau epic — il n'a de sens qu'au niveau issue,
# une fois le lot actif et découpé (règle explicite du backlog).

version: 1

milestones:
  - id: foundation
    name: Foundation
  - id: alpha-interne
    name: Alpha interne
  - id: pilote-ferme
    name: Pilote fermé
  - id: beta-controlee
    name: Bêta contrôlée
  - id: v1-commerciale
    name: V1 commerciale

programs:
  - id: P00
    name: Gouvernance produit et entreprise
    depends_on: []
  - id: P01
    name: Architecture, protocole et sécurité
    depends_on: [P00]
  - id: P02
    name: Dépôt, outillage et chaîne de livraison
    depends_on: [P01]
  - id: P03
    name: Plateforme Go et base PostgreSQL
    depends_on: [P02]
  - id: P04
    name: Identity, appareils, MFA et sessions
    depends_on: [P03]
  - id: P05
    name: Coffre cryptographique et clés
    depends_on: [P01, P03, P04]
  - id: P06
    name: Mandats, politiques et révocation
    depends_on: [P04, P05]
  - id: P07
    name: Preuve, audit et notifications
    depends_on: [P03, P04, P06]
  - id: P08
    name: Interfaces web, portail client et PWA
    depends_on: [P04, P05, P06]
  - id: P09
    name: Extension navigateur et accès délégué
    depends_on: [P05, P06, P07]
  - id: P10
    name: Opérations, fiabilité et sécurité production
    depends_on: [P02, P03, P04, P05, P06, P07, P08, P09]
  - id: P11
    name: Pilote cabinets, conformité, livraison et exploitation
    depends_on: [P08, P09, P10]

epics:
  # ---------------------------------------------------------------------
  # P00 — Gouvernance produit et entreprise
  # ---------------------------------------------------------------------
  - id: EP-00.01
    program: P00
    title: Créer l'entité, propriété intellectuelle et responsabilités KOFRA
    description: Formaliser la structure juridique de KOFRA et la propriété du code, du manifeste et des marques associées.
    depends_on: []
    priority: P1
    risk: Low
    security_critical: false
    release_gate: None
    milestone: foundation
    size: M
    acceptance_criteria:
      - Statut juridique de l'entité documenté et propriété du dépôt GitHub clarifiée.
      - Responsabilités (produit, sécurité, conformité) attribuées nommément.

  - id: EP-00.02
    program: P00
    title: Définir la gouvernance de sécurité et les rôles d'accès internes
    description: Fixer qui a accès à quoi dans l'organisation KOFRA (dépôt, infra, secrets) et selon quel principe de moindre privilège.
    depends_on: [EP-00.01]
    priority: P0
    risk: Medium
    security_critical: true
    release_gate: None
    milestone: foundation
    size: M
    acceptance_criteria:
      - Matrice rôles/accès documentée pour GitHub, infra et secrets de production.
      - Principe de moindre privilège appliqué et vérifiable pour chaque rôle listé.

  - id: EP-00.03
    program: P00
    title: Définir clients cibles, pilote et critères d'éligibilité cabinet
    description: Spécifier le profil des cabinets d'expertise comptable CEMAC éligibles au pilote KOFRA.
    depends_on: [EP-00.01]
    priority: P1
    risk: Low
    security_critical: false
    release_gate: None
    milestone: foundation
    size: S
    acceptance_criteria:
      - Critères d'éligibilité cabinet écrits (taille, pays, maturité numérique).
      - Liste de cabinets candidats potentiels identifiée pour EP-11.01.

  - id: EP-00.04
    program: P00
    title: Définir la politique de données, confidentialité et conservation
    description: Fixer les règles de conservation, de localisation et de traitement des données KOFRA, cohérentes avec le zero-knowledge du manifeste.
    depends_on: [EP-00.02]
    priority: P0
    risk: Medium
    security_critical: true
    release_gate: None
    milestone: foundation
    size: M
    acceptance_criteria:
      - Politique de conservation et de suppression des données écrite et référencée par EP-01.03 (modèle de menace).
      - Durées de rétention par type de donnée (métadonnées, preuve, ciphertexts) explicites.

  - id: EP-00.05
    program: P00
    title: Définir la politique de divulgation et de réponse aux vulnérabilités
    description: Écrire la procédure de divulgation responsable (canal de contact, délais, coordination) pour KOFRA.
    depends_on: [EP-00.02]
    priority: P0
    risk: Medium
    security_critical: true
    release_gate: None
    milestone: foundation
    size: S
    acceptance_criteria:
      - Politique de divulgation responsable publiée (canal de contact, SLA de première réponse).
      - Alignée avec EP-10.10 (gestion d'incident et statut public).

  - id: EP-00.06
    program: P00
    title: Définir les métriques produit, sécurité et exploitation
    description: Fixer les métriques suivies pour juger la santé produit, sécurité et opérationnelle de KOFRA.
    depends_on: [EP-00.03]
    priority: P1
    risk: Low
    security_critical: false
    release_gate: None
    milestone: foundation
    size: S
    acceptance_criteria:
