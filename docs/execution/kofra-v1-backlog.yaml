  - id: EP-09.08
    program: P09
    title: "Gérer OTP, CAPTCHA, erreurs et refus sans contournement"
    description: L'extension ne contourne jamais OTP, CAPTCHA ou authentification tierce (ADR 0005) — gestion explicite des cas d'échec.
    depends_on: [EP-09.06]
    priority: P0
    risk: Critical
    security_critical: true
    release_gate: Pilot
    milestone: pilote-ferme
    size: M
    acceptance_criteria:
      - Aucun test ni code de l'extension n'automatise la résolution d'un CAPTCHA ou d'un second facteur tiers.

  - id: EP-09.09
    program: P09
    title: "Tester ports, navigateurs, cycle MV3, permissions et attaques de contenu"
    description: Suite de tests couvrant EP-09.01 à EP-09.08 sur les navigateurs cibles, y compris des scénarios de contenu malveillant sur la page hôte.
