  # ---------------------------------------------------------------------
  # P08 — Interfaces web, portail client et PWA
  # ---------------------------------------------------------------------
  - id: EP-08.01
    program: P08
    title: "Initialiser Next.js, design system, i18n et sécurité front-end"
