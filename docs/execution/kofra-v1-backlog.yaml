    risk: High
    security_critical: true
    release_gate: Pilot
    milestone: pilote-ferme
    size: L
    acceptance_criteria:
      - Un mandat créé depuis l'UI respecte exactement les contraintes du moteur de politique (EP-06.02), sans contournement côté client.

  - id: EP-08.07
    program: P08
    title: "Écrans de récupération, rotation et révocation"
    description: Interface pour les trois niveaux de révocation (P06) et la procédure de récupération à seuil (P05).
    depends_on: [EP-05.08, EP-05.09, EP-06.07]
    priority: P1
    risk: High
    security_critical: true
    release_gate: Pilot
    milestone: pilote-ferme
    size: L
    acceptance_criteria:
      - Chaque niveau de révocation est présenté avec la garantie exacte qu'il offre, sans langage ambigu.

  - id: EP-08.08
    program: P08
    title: "Journal de preuve, alertes et export"
    description: Interface de consultation et d'export de preuve (manifeste §"KOFRA Proof") consommant P07.
    depends_on: [EP-07.05, EP-07.07]
    priority: P1
    risk: Medium
    security_critical: true
    release_gate: Pilot
    milestone: pilote-ferme
    size: M
    acceptance_criteria:
