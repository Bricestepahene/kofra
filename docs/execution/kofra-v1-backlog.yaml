    size: L
    acceptance_criteria:
      - Un secret saisi n'est jamais visible dans les requêtes réseau autrement que sous forme chiffrée (vérifié par inspection réseau).

  - id: EP-08.05
    program: P08
    title: "Dashboard cabinet : coffres, clients et inventaire d'accès"
    description: Vue d'ensemble des coffres, clients et accès pour un cabinet (manifeste §"KOFRA Vault").
    depends_on: [EP-05.05, EP-08.03]
    priority: P1
    risk: Medium
    security_critical: false
    release_gate: Pilot
    milestone: pilote-ferme
    size: M
    acceptance_criteria:
      - Le dashboard n'affiche jamais de secret en clair, uniquement des métadonnées (type, dernière rotation).

  - id: EP-08.06
    program: P08
    title: "Écrans de mandat : demande, approbation, durée et retrait"
