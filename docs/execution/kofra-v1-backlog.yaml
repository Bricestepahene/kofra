  - id: EP-08.03
    program: P08
    title: Onboarding cabinet, équipes et rôles
    description: Parcours de création d'un cabinet, invitation d'équipe, attribution de rôles depuis le web.
    depends_on: [EP-04.07, EP-08.02]
    priority: P1
    risk: Medium
    security_critical: false
    release_gate: Pilot
    milestone: pilote-ferme
    size: M
    acceptance_criteria:
      - Un cabinet peut être créé et une équipe invitée sans intervention manuelle en base de données.

  - id: EP-08.04
    program: P08
    title: "Portail client : saisie chiffrée et gestion de ses coffres"
    description: Interface où le client saisit directement ses secrets, chiffrés côté navigateur avant tout envoi (manifeste §"KOFRA Client").
    depends_on: [EP-05.06, EP-08.02]
