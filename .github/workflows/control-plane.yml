# CI qualité — control-plane (EP-02.05).
#
# Se déclenche uniquement sur les chemins control-plane/** : au moment où ce
# fichier est écrit, control-plane/ n'existe pas encore sur le disque
# (fondations, avant EP-03.01) — ce workflow restera silencieux/inactif tant
# qu'aucun commit ne touche ce répertoire, ce qui est le comportement
# attendu, pas un défaut.
#
# Version Go pinnée exactement (1.23.4, pas "1.23.x") — le control plane a
# vocation à tourner 10-15 ans (ADR 0001) ; une version flottante en CI
# introduirait une dérive silencieuse entre les builds.

name: control-plane

on:
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane.yml"
  pull_request:
    paths:
      - "control-plane/**"
      - ".github/workflows/control-plane.yml"

permissions:
  contents: read

env:
  GO_VERSION: "1.23.4"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: control-plane/go.sum

      - name: gofmt (échoue si des fichiers ne sont pas formatés)
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "Fichiers non formatés (gofmt -l) :"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      # golangci-lint est la cible de lint retenue dans le Makefile racine
      # (`make lint`) et le design V1 §8 — exécuté via l'action officielle,
      # sans fichier .golangci.yml requis (règles par défaut tant qu'aucune
      # configuration dédiée n'est ajoutée).
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: control-plane
          version: latest

  test:
    name: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: control-plane/go.sum

      - name: go test ./...
        run: go test -race -shuffle=on ./...
